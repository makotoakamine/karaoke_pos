{% extends "base.html" %}
{% load i18n %}

{% block title %}{{ title }} &middot; Karaokê POS{% endblock %}

{% block content %}
<section class="karaoke-kitchen">
  <div class="container-fluid py-3">
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
      <h1 class="h3 mb-0">{% trans "Cozinha" %}</h1>
      <span class="text-muted small" id="kitchen-last-refresh">
        {% trans "Atualizando a cada 5 segundos…" %}
      </span>
    </div>

    <div id="kitchen-queue" aria-live="polite">
      {% include "orders/_kitchen_queue.html" %}
    </div>
  </div>
</section>
{% endblock %}

{% block extra_js %}
<script>
(function () {
  var queueEl = document.getElementById("kitchen-queue");
  if (!queueEl) return;
  var POLL_URL = "{% url 'orders:kitchen-queue' %}";
  var INTERVAL_MS = 5000;

  function refresh() {
    fetch(POLL_URL, {
      headers: { "X-Requested-With": "XMLHttpRequest" },
      credentials: "same-origin"
    })
      .then(function (resp) {
        if (!resp.ok) throw new Error("HTTP " + resp.status);
        return resp.text();
      })
      .then(function (html) {
        queueEl.innerHTML = html;
      })
      .catch(function () {
        // Network errors or 302/login redirects: ignore quietly; the next
        // poll will retry. A 302 to the login page means the session died
        // and the kitchen should be reloaded manually.
      });
  }

  setInterval(refresh, INTERVAL_MS);
})();
</script>
{% endblock %}
